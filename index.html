<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="layer">
        <!-- Home Team -->
        <div class="team-card">
            <h3>HOME</h3>
            <!-- Added a unique ID and set default score to 0 -->
            <span class="screen" id="home-score">0</span><br>
            <div class="btn-group">
                <button onclick="addHome(1)">+1</button>
                <button onclick="addHome(2)">+2</button>
                <button onclick="addHome(3)">+3</button>
            </div>
        </div>

        <!-- Guest Team -->
        <div class="team-card">
            <h3>GUEST</h3>
            <!-- Added a unique ID and set default score to 0 -->
            <span class="screen" id="guest-score">0</span><br>
            <div class="btn-group">
                <button onclick="addGuest(1)">+1</button>
                <button onclick="addGuest(2)">+2</button>
                <button onclick="addGuest(3)">+3</button>
            </div>
        </div>
        <div class="team-card">
            <div class="btn-group">
                <button onclick="reset()">Reset</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
